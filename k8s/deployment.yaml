apiVersion: apps/v1
kind: Deployment
metadata:
  name: fast_api
  namespace: default
  labels:
    app: fast_api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fast_api
  template:
    metadata:
      labels:
        app: fast_api
    spec:
      containers:
      - name: fast-container
        image: adhil7/fast-service:1
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        livenessProbe:
          httpGet:
            path: /healthz
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: "250m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"